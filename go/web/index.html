<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>统一模型</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #202124;
      }
      body { margin: 0; padding: 24px; }
      main { max-width: 960px; margin: 0 auto; }
      h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
      .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
      .mode-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; }
      .mode-toggle input { width: 16px; height: 16px; padding: 0; accent-color: #2563eb; cursor: pointer; }
      .save-bar { display: flex; justify-content: center; margin-top: 18px; }
      .row-header { display: flex; gap: 10px; align-items: center; padding: 0 15px 6px; font-size: 12px; font-weight: 600; color: #667085; }
      .row-header .col-provider { flex: 0 0 25%; }
      .row-header .col-target { flex: 1; }
      .row-header .col-alias { flex: 0 0 26%; }
      .row-header .col-action { width: 54px; text-align: center; }
      .row { display: flex; gap: 10px; align-items: center; }
      .mapping-card { border: 1px solid #e4e7ec; border-left: 4px solid var(--card-accent, #98a2b3); border-radius: 12px; padding: 14px; margin-top: 12px; transition: border-color .15s ease; }
      .mapping-card:hover { border-color: #ccd2db; }
      .card-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
      .card-index { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: #475467; background: #f2f4f7; border-radius: 6px; padding: 2px 8px; }
      .card-summary { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 14px; }
      .card-summary .alias { color: #101828; font-weight: 700; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-summary .arrow { color: #667085; font-weight: 500; flex: 0 0 auto; }
      .card-summary .target { color: #344054; font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-summary .placeholder { color: #98a2b3; font-weight: 500; }
      .badge { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: var(--card-accent, #475467); background: var(--card-accent-soft, rgba(71, 84, 103, .12)); border: 1px solid var(--card-accent-border, rgba(71, 84, 103, .35)); max-width: 300px; }
      .badge .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-sub { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e4e7ec; }
      .col-context { flex: 1 1 380px; display: flex; flex-direction: column; gap: 4px; min-width: 280px; }
      .col-modalities { flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px; min-width: 240px; }
      .sub-label { font-size: 12px; font-weight: 600; color: #667085; }
      .inline-control { display: flex; gap: 8px; align-items: center; }
      .inline-control input { flex: 1; min-width: 0; }
      button.compact { padding: 10px 12px; flex: 0 0 auto; }
      .hint { font-size: 12px; color: #667085; min-height: 16px; }
      .checkboxes { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 8px 2px 2px; }
      .checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; cursor: pointer; width: auto; }
      .checkbox input { width: 16px; height: 16px; padding: 0; accent-color: #2563eb; cursor: pointer; }
      .col-provider { flex: 0 0 25%; display: flex; flex-direction: column; gap: 4px; }
      .col-target { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .col-alias { flex: 0 0 26%; display: flex; flex-direction: column; gap: 4px; }
      .col-action { width: 54px; display: flex; justify-content: flex-end; }
      select, input { box-sizing: border-box; width: 100%; padding: 10px 11px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #202124; font-size: 14px; outline: none; }
      select:focus, input:focus { border-color: #2563eb; }
      button { border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
      button.primary { background: #2563eb; color: #fff; }
      button.primary:hover { background: #1d4ed8; }
      button.secondary { background: #e9eefb; color: #1d4ed8; }
      button.secondary:hover { background: #dbe4fa; }
      button.ghost { background: transparent; color: #667085; border: 1px solid #d0d5dd; }
      button.ghost:hover { background: #f3f4f6; color: #111827; }
      button.danger { background: transparent; color: #b42318; padding-inline: 8px; }
      button.danger:hover { background: #fee4e2; }
      button:disabled { opacity: .55; cursor: wait; }
      .status { min-height: 20px; margin-top: 14px; font-size: 13px; }
      .status.error { color: #b42318; font-weight: 500; }
      .status.ok { color: #067647; font-weight: 500; }
      .empty { padding: 24px 0 12px; color: #667085; font-size: 14px; text-align: center; }
      .custom-input { margin-top: 4px; }
      .key-panel { display: none; background: #f9fafb; border: 1px dashed #d0d5dd; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
      .key-panel.show { display: block; }
      .key-panel-inner { display: flex; gap: 10px; align-items: center; }
      .key-panel-inner input { max-width: 420px; }
      @media (max-width: 680px) {
        body { padding: 14px; }
        .row-header { display: none; }
        .row { align-items: stretch; flex-wrap: wrap; }
        .mapping-card { padding: 12px; }
        .card-header { gap: 8px; }
        .card-summary { flex: 1 1 100%; }
        .col-provider, .col-target, .col-alias { flex: 1 1 100%; }
        .col-context, .col-modalities { flex: 1 1 100%; min-width: 0; }
        .col-action { width: 100%; justify-content: flex-end; }
        .key-panel-inner { flex-direction: column; align-items: stretch; }
        .key-panel-inner input { max-width: 100%; }
      }
      @media (prefers-color-scheme: dark) {
        :root { background: #17181b; color: #f3f4f6; }
        body { background: #17181b; color: #f3f4f6; }
        h1 { color: #f3f4f6; }
        .card { background: #1c1e22; border-color: #3a3f46; box-shadow: none; }
        .mode-toggle { color: #e5e7eb; }
        .row-header { color: #9aa3af; }
        input, select { background: #22252a; border-color: #3a3f46; color: #f3f4f6; }
        .key-panel { background: #16181c; border-color: #3a3f46; }
        .mapping-card { background: #16181c; border-color: #3a3f46; }
        .mapping-card:hover { border-color: #4a515a; }
        .card-index { background: #262a31; color: #aeb5bf; }
        .card-summary .alias { color: #f3f4f6; }
        .card-summary .target { color: #d3d8de; }
        .card-summary .arrow, .card-summary .placeholder { color: #8b929c; }
        .row-sub { border-top-color: #3a3f46; }
        .sub-label, .hint { color: #aeb5bf; }
        button.secondary { background: #243044; color: #93c5fd; }
        button.secondary:hover { background: #2c3b52; }
        button.ghost { color: #cbd5e1; border-color: #3a3f46; }
        button.ghost:hover { background: #262a31; color: #f3f4f6; }
        button.danger:hover { background: #3a1d1d; }
        .empty { color: #9aa3af; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>统一模型</h1>

      <section class="card">
        <div class="toolbar">
          <label class="mode-toggle" title="开启后，客户端看到的模型列表只包含本插件配置的别名">
            <input id="enhanced-mode" type="checkbox" />
            增强模式
          </label>
          <div class="actions">
            <button class="secondary" id="add">增加模型</button>
            <button class="secondary" id="load">刷新</button>
            <button class="ghost" id="toggle-key" title="设置管理密钥">🔑</button>
          </div>
        </div>

        <div id="key-panel" class="key-panel">
          <div class="key-panel-inner">
            <input id="key" type="password" autocomplete="off" placeholder="Management Key（管理接口需要密钥时填写）" />
            <button class="ghost" id="save-key-btn">确认</button>
          </div>
        </div>

        <div id="row-header" class="row-header">
          <div class="col-provider">供应商 / 凭证 (Provider)</div>
          <div class="col-target">实际模型名 (Target Model)</div>
          <div class="col-alias">客户端模型名 (Client Alias)</div>
          <div class="col-action">操作</div>
        </div>
        <div id="rows"></div>
        <div class="save-bar">
          <button class="primary" id="save">保存映射</button>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
    <script>
      const pluginID = 'unified-model';
      const configURL = `/v0/management/plugins/${pluginID}/config`;
      const resourceURL = `/v0/resource/plugins/${pluginID}/status`;
      const rows = document.getElementById('rows');
      const rowHeader = document.getElementById('row-header');
      const status = document.getElementById('status');
      const keyInput = document.getElementById('key');
      const keyPanel = document.getElementById('key-panel');
      const toggleKeyBtn = document.getElementById('toggle-key');
      const enhancedModeInput = document.getElementById('enhanced-mode');
      let mappings = [];
      let managementKey = '';
      let enhancedMode = false;

      // Discovered routing entries, built only from credentials that are actually
      // configured in CLIProxyAPI (OAuth auth files, config API keys and
      // openai-compatibility providers). Never a hardcoded provider list.
      // Entry: { id, provider, authId, label, title, models }
      //   - provider: routing provider key written to the mapping config.
      //   - authId: credential ID that pins execution to one credential, '' for a
      //     provider-level (round-robin) entry.
      let providerEntries = [];

      // Config API key lists mapped to their routing provider keys.
      const apiKeyConfigProviders = [
        ['codex-api-key', 'codex'],
        ['claude-api-key', 'claude'],
        ['gemini-api-key', 'gemini'],
        ['interactions-api-key', 'gemini-interactions'],
        ['xai-api-key', 'xai'],
        ['meta-api-key', 'meta'],
        ['vertex-api-key', 'vertex'],
      ];

      const customValue = '__custom__';
      let defaultContextLength = 128000;
      let maxContextLength = 100000000;
      // Built-in model name -> context window table, loaded from the plugin (includes user overrides).
      let catalogRules = [];
      // User-managed table overrides, persisted as plugins.configs.unified-model.context-lengths.
      let contextLengthOverrides = {};
      // Context windows reported by CLIProxyAPI itself (config overrides and model definitions).
      let hostContextLengths = {};
      // Supported input modalities, kept in the same canonical order as the plugin.
      const modalityOptions = [
        { value: 'text', label: '文本' },
        { value: 'image', label: '图像' },
        { value: 'audio', label: '音频' },
        { value: 'video', label: '视频' },
      ];

      function array(value) {
        return Array.isArray(value) ? value : [];
      }

      // compatProviderKey mirrors CLIProxyAPI's OpenAICompatibleProviderKey: the routing
      // provider key of an openai-compatibility entry is "openai-compatible-<name>".
      function compatProviderKey(name) {
        const normalized = String(name || '').trim().toLowerCase();
        if (!normalized || normalized === 'openai-compatibility') return 'openai-compatibility';
        if (normalized.startsWith('openai-compatible-')) return normalized;
        return 'openai-compatible-' + normalized;
      }

      // configModelName returns the client-facing model name of a config model entry:
      // the alias when set, otherwise the upstream name.
      function configModelName(model) {
        if (typeof model === 'string') return model.trim();
        if (!model || typeof model !== 'object') return '';
        return String(model.alias || model.name || model.id || '').trim();
      }

      // normalizeContext keeps 0 as "auto": the built-in table or the default applies.
      function normalizeContext(value) {
        const parsed = Math.floor(Number(value));
        if (!Number.isFinite(parsed) || parsed <= 0) return 0;
        return Math.min(parsed, maxContextLength);
      }

      // compactName mirrors the plugin: lower-case, drop provider prefix, thinking
      // suffix and every separator, so gpt-5.6-sol and gpt_5_6_sol compare equal.
      function compactName(name) {
        let text = String(name || '').trim().toLowerCase();
        const suffix = text.indexOf('(');
        if (suffix > 0) text = text.slice(0, suffix);
        const slash = text.lastIndexOf('/');
        if (slash >= 0) text = text.slice(slash + 1);
        return text.replace(/[-._ \s]/g, '');
      }

      function rememberHostContextLength(model, value) {
        const key = compactName(model);
        const length = normalizeContext(value);
        if (!key || !length) return;
        if (!hostContextLengths[key]) hostContextLengths[key] = length;
      }

      // contextHintFor resolves the recommended context window for a model name.
      // Priority: user overrides of the table > CLIProxyAPI's own model library > built-in
      // table. Within the table the longest matching prefix wins, so a specific model
      // beats its family entry.
      function contextHintFor(model) {
        const key = compactName(model);
        if (!key) return null;
        let best = null;
        for (const rule of catalogRules) {
          const pattern = compactName(rule.pattern);
          if (!pattern || !key.startsWith(pattern)) continue;
          if (!best || pattern.length > best.pattern.length) best = rule;
        }
        if (best && best.source === 'custom') {
          return { contextLength: best.contextLength, source: '自定义模型表', model: best.pattern };
        }
        if (hostContextLengths[key]) {
          return { contextLength: hostContextLengths[key], source: 'CLIProxyAPI 模型库', model };
        }
        if (best) {
          return { contextLength: best.contextLength, source: '内置模型表', model: best.pattern };
        }
        return null;
      }

      // applyTableOverrideLocally keeps the in-page table in sync after a successful save.
      function applyTableOverrideLocally(pattern, value) {
        const key = compactName(pattern);
        let replaced = false;
        catalogRules = catalogRules.map((rule) => {
          if (compactName(rule.pattern) !== key) return rule;
          replaced = true;
          return { pattern: rule.pattern, contextLength: value, source: 'custom' };
        });
        if (!replaced) catalogRules.push({ pattern, contextLength: value, source: 'custom' });
        catalogRules.sort((left, right) => left.pattern.localeCompare(right.pattern));
      }

      function pickModalities(list) {
        const wanted = new Set(
          (Array.isArray(list) ? list : [])
            .map((item) => String(item || '').trim().toLowerCase())
            .filter(Boolean)
        );
        return modalityOptions.map((option) => option.value).filter((value) => wanted.has(value));
      }

      function normalizeModalities(list) {
        const picked = pickModalities(list);
        return picked.length ? picked : ['text'];
      }

      function toStateMapping(item) {
        return {
          name: String((item && item.name) || '').trim(),
          target: String((item && item.target) || '').trim(),
          provider: String((item && item.provider) || '').trim().toLowerCase(),
          auth: String((item && item.auth) || '').trim(),
          contextLength: normalizeContext(item && item['context-length']),
          modalities: normalizeModalities(item && item.modalities),
        };
      }

      function toConfigMapping(item) {
        const config = {
          name: String((item && item.name) || '').trim(),
          target: String((item && item.target) || '').trim(),
          provider: String((item && item.provider) || '').trim().toLowerCase(),
          modalities: pickModalities(item && item.modalities),
        };
        // A pinned credential only makes sense together with its provider.
        const auth = String((item && item.auth) || '').trim();
        if (auth) config.auth = auth;
        // 0 means "auto": leave the key out so the plugin can apply the built-in table.
        const length = normalizeContext(item && item.contextLength);
        if (length > 0) config['context-length'] = length;
        return config;
      }

      function readContextLengthOverrides(raw) {
        const entries = raw && typeof raw === 'object' ? Object.entries(raw) : [];
        const output = {};
        for (const [key, value] of entries) {
          const pattern = String(key).trim().toLowerCase();
          const length = normalizeContext(value);
          if (pattern && length > 0) output[pattern] = length;
        }
        return output;
      }

      function setStatus(message, kind) {
        status.textContent = message || '';
        status.className = `status ${kind || ''}`;
      }

      function decodeStored(value) {
        const prefix = 'enc::v1::';
        if (!value || !value.startsWith(prefix)) return value || '';
        try {
          const encoded = atob(value.slice(prefix.length));
          const key = new TextEncoder().encode(
            `cli-proxy-api-webui::secure-storage|${location.host}|${navigator.userAgent}`
          );
          const bytes = new Uint8Array(encoded.length);
          for (let i = 0; i < encoded.length; i++) {
            bytes[i] = encoded.charCodeAt(i) ^ key[i % key.length];
          }
          return new TextDecoder().decode(bytes);
        } catch (_) {
          return '';
        }
      }

      function savedKey() {
        try {
          const auth = JSON.parse(decodeStored(localStorage.getItem('cli-proxy-auth') || ''));
          if (auth && typeof auth.managementKey === 'string' && auth.managementKey.trim()) {
            return auth.managementKey.trim();
          }
        } catch (_) {}
        try {
          const legacy = decodeStored(localStorage.getItem('managementKey') || '').trim();
          if (legacy) return legacy;
        } catch (_) {}
        try {
          return sessionStorage.getItem('unified-model-management-key') || '';
        } catch (_) {
          return '';
        }
      }

      function authHeaders() {
        const key = (keyInput.value || managementKey || '').trim();
        return key ? { Authorization: `Bearer ${key}` } : {};
      }

      async function request(url, method = 'GET', body = undefined) {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(`${response.status} ${text || response.statusText}`);
        }
        return response.status === 204 ? {} : response.json();
      }

      // fetchModelCatalog loads the plugin's built-in model name -> context window table.
      async function fetchModelCatalog() {
        try {
          const data = await request(`${resourceURL}?view=catalog`);
          if (Number(data && data.defaultContextLength) > 0) defaultContextLength = Number(data.defaultContextLength);
          if (Number(data && data.maxContextLength) > 0) maxContextLength = Number(data.maxContextLength);
          catalogRules = (Array.isArray(data && data.rules) ? data.rules : [])
            .map((rule) => ({
              pattern: String((rule && rule.pattern) || '').trim(),
              contextLength: normalizeContext(rule && rule.contextLength),
              source: String((rule && rule.source) || 'built-in').trim() === 'custom' ? 'custom' : 'built-in',
            }))
            .filter((rule) => rule.pattern && rule.contextLength > 0);
        } catch (_) {
          catalogRules = [];
        }
        return catalogRules.length;
      }

      // fetchProviderEntries discovers the actually configured credentials and builds the
      // routing entries for the provider dropdown:
      //   1. /v0/management/config            -> openai-compatibility providers + API key providers
      //   2. /v0/management/auth-files        -> OAuth login credentials (one entry per file)
      //   3. /v0/management/auth-files/models -> models available to each OAuth credential
      //   4. /v0/management/model-definitions -> context windows + static models for configured providers
      // Providers without any configured credential never appear.
      async function fetchProviderEntries() {
        // provider -> { oauth: [{authId, label, models}], apikey: Set(models), compat: {label, models} }
        const providers = new Map();
        const extras = new Map();

        function bucket(provider) {
          let entry = providers.get(provider);
          if (!entry) {
            entry = { oauth: [] };
            providers.set(provider, entry);
          }
          return entry;
        }
        function extraModels(provider) {
          let set = extras.get(provider);
          if (!set) {
            set = new Set();
            extras.set(provider, set);
          }
          return set;
        }
        function mergeInto(set, models) {
          for (const model of models) {
            if (model) set.add(model);
          }
        }

        // 1. Configured providers from the management config.
        let cfg = null;
        try {
          cfg = await request('/v0/management/config');
        } catch (_) {}
        if (cfg) {
          for (const entry of array(cfg['openai-compatibility'])) {
            const name = String((entry && entry.name) || '').trim();
            if (!name || entry.disabled) continue;
            const current = bucket(compatProviderKey(name));
            const models = current.compat ? current.compat.models : new Set();
            for (const model of array(entry && entry.models)) {
              const modelName = configModelName(model);
              if (modelName) models.add(modelName);
              if (model && typeof model === 'object') rememberHostContextLength(modelName, model['max-context-length']);
            }
            current.compat = { label: name, models };
          }
          for (const [configKey, providerKey] of apiKeyConfigProviders) {
            const list = array(cfg[configKey]);
            const models = new Set();
            let count = 0;
            for (const item of list) {
              const apiKey = String((item && item['api-key']) || '').trim();
              const baseURL = String((item && item['base-url']) || '').trim();
              if (!apiKey && !baseURL) continue;
              count += 1;
              for (const model of array(item && item.models)) {
                const modelName = configModelName(model);
                if (modelName) models.add(modelName);
                if (model && typeof model === 'object') rememberHostContextLength(modelName, model['max-context-length']);
              }
            }
            if (count > 0) {
              const current = bucket(providerKey);
              if (!current.apikey) current.apikey = new Set();
              mergeInto(current.apikey, Array.from(models));
            }
          }
        }

        // 2. OAuth login credentials: every auth file is one credential. A provider with
        // several files gets one pinnable entry per file.
        try {
          const afData = await request('/v0/management/auth-files');
          for (const file of array(afData && afData.files)) {
            const provider = String((file && (file.provider || file.type)) || '').trim().toLowerCase();
            if (!provider || provider === pluginID) continue;
            if (!file || file.disabled || String(file.status || '').trim().toLowerCase() === 'disabled') continue;
            const authId = String(file.id || file.name || '').trim();
            const label = String(file.label || file.email || file.account || file.name || authId || '').trim();
            let models = [];
            const queryName = String(file.name || file.id || '').trim();
            if (queryName) {
              try {
                const mData = await request(`/v0/management/auth-files/models?name=${encodeURIComponent(queryName)}`);
                models = array(mData && mData.models)
                  .map((model) => String((model && (model.id || model.name)) || '').trim())
                  .filter(Boolean);
              } catch (_) {}
            }
            const current = bucket(provider);
            if (authId) {
              current.oauth.push({ authId, label, models });
            } else {
              mergeInto(extraModels(provider), models);
            }
          }
        } catch (_) {}

        // 3. Static model definitions complete model lists and carry the context windows
        // advertised by CLIProxyAPI. Only queried for configured providers.
        for (const provider of Array.from(providers.keys())) {
          try {
            const chData = await request(`/v0/management/model-definitions/${encodeURIComponent(provider)}`);
            for (const model of array(chData && chData.models)) {
              const name = String((model && (model.id || model.name)) || '').trim();
              if (!name) continue;
              rememberHostContextLength(name, model.context_length);
              extraModels(provider).add(name);
            }
          } catch (_) {}
        }

        // 4. Build the dropdown entries.
        const entries = [];
        const sortedProviders = Array.from(providers.keys()).sort((left, right) => left.localeCompare(right));
        for (const provider of sortedProviders) {
          const current = providers.get(provider);
          const extra = extras.get(provider) || new Set();
          const union = new Set(extra);
          for (const credential of current.oauth) mergeInto(union, credential.models);
          if (current.apikey) mergeInto(union, Array.from(current.apikey));
          if (current.compat) mergeInto(union, Array.from(current.compat.models));
          const unionModels = Array.from(union).sort();

          const sourceCount = current.oauth.length + (current.apikey ? 1 : 0) + (current.compat ? 1 : 0);
          if (sourceCount <= 1) {
            // Single credential: one provider-level entry, native routing (no pin).
            let label = provider;
            let title = provider;
            if (current.oauth.length === 1) {
              label = `${provider} · ${current.oauth[0].label}`;
              title = `${provider} OAuth 凭证：${current.oauth[0].label}`;
            } else if (current.compat) {
              label = current.compat.label;
              title = `AI 提供商（openai-compatibility）：${current.compat.label}`;
            } else if (current.apikey) {
              label = `${provider} · API 密钥`;
              title = `${provider} API 密钥`;
            }
            entries.push({ id: `${provider}|`, provider, authId: '', label, title, models: unionModels });
            continue;
          }

          // Multiple credentials: an aggregate (round-robin) entry plus one pinnable
          // entry per OAuth credential.
          entries.push({
            id: `${provider}|`,
            provider,
            authId: '',
            label: `${provider}（全部凭证）`,
            title: `${provider}：轮询使用该供应商的全部凭证`,
            models: unionModels,
          });
          for (const credential of current.oauth) {
            entries.push({
              id: `${provider}|${credential.authId}`,
              provider,
              authId: credential.authId,
              label: `${provider} · ${credential.label}`,
              title: `${provider} 固定凭证：${credential.label}（仅使用该凭证）`,
              models: Array.from(new Set(credential.models)).sort(),
            });
          }
        }

        providerEntries = entries;
        const credentialCount = entries.filter((entry) => entry.authId).length;
        return { providers: sortedProviders.length, credentials: credentialCount };
      }

      function entryById(id) {
        return providerEntries.find((entry) => entry.id === id) || null;
      }

      // accentHues spreads provider colors around the color wheel so neighboring
      // providers rarely share a hue.
      const accentHues = [4, 28, 45, 95, 150, 185, 210, 245, 275, 310, 335, 55];

      // accentFor maps a provider key to a stable accent color: the same provider gets
      // the same stripe and badge color on every card, so the list can be scanned by
      // provider at a glance.
      function accentFor(provider) {
        const key = String(provider || '').trim().toLowerCase() || 'default';
        let hash = 0;
        for (let i = 0; i < key.length; i++) {
          hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        }
        const hue = accentHues[hash % accentHues.length];
        return {
          solid: `hsl(${hue}, 62%, 47%)`,
          soft: `hsl(${hue}, 62%, 47%, 0.13)`,
          border: `hsl(${hue}, 52%, 58%, 0.45)`,
        };
      }

      // findEntryForMapping resolves the dropdown entry for a saved mapping. A missing
      // pinned credential falls back to the provider-level entry; legacy compat provider
      // names ("jyld") upgrade to their "openai-compatible-*" key.
      function findEntryForMapping(mapping) {
        const provider = String((mapping && mapping.provider) || '').trim().toLowerCase();
        const auth = String((mapping && mapping.auth) || '').trim();
        if (!provider) return null;
        if (auth) {
          const pinned = providerEntries.find((entry) => entry.provider === provider && entry.authId === auth);
          if (pinned) return pinned;
        }
        const providerLevel = providerEntries.find((entry) => entry.provider === provider && !entry.authId);
        if (providerLevel) return providerLevel;
        return providerEntries.find((entry) => entry.provider === compatProviderKey(provider) && !entry.authId) || null;
      }

      function getModelsForEntry(entry) {
        if (!entry) return [];
        return (entry.models || []).slice();
      }

      // buildOptionsRow renders the per-alias options: a manual context length input that is
      // prefilled from the built-in model name table, plus the modality checkboxes.
      function buildOptionsRow(mapping, index) {
        const subRow = document.createElement('div');
        subRow.className = 'row-sub';

        // 1. Context length column (manual input with a built-in suggestion).
        const contextCol = document.createElement('div');
        contextCol.className = 'col-context';
        const contextLabel = document.createElement('div');
        contextLabel.className = 'sub-label';
        contextLabel.textContent = '上下文长度 (Context Length)';

        const contextControl = document.createElement('div');
        contextControl.className = 'inline-control';

        const contextInput = document.createElement('input');
        contextInput.type = 'number';
        contextInput.min = '0';
        contextInput.max = String(maxContextLength);
        contextInput.step = '1';
        contextInput.title = '声明给客户端的上下文窗口（tokens），留空则自动使用内置模型表的值';

        const autoButton = document.createElement('button');
        autoButton.type = 'button';
        autoButton.className = 'ghost compact';
        autoButton.textContent = '自动';
        autoButton.title = '清除手动值，改由模型表/默认值决定';

        const saveTableButton = document.createElement('button');
        saveTableButton.type = 'button';
        saveTableButton.className = 'ghost compact';
        saveTableButton.textContent = '保存';
        saveTableButton.title = '把当前上下文长度覆写到模型表中该模型（target）的默认值，所有指向它的别名都会跟着变';

        const contextHint = document.createElement('div');
        contextHint.className = 'hint';
        contextCol.append(contextLabel, contextControl, contextHint);
        contextControl.append(contextInput, autoButton, saveTableButton);

        mapping.contextLength = normalizeContext(mapping.contextLength);

        function renderHint() {
          const hint = contextHintFor(mapping.target);
          contextInput.placeholder = hint
            ? `自动：${hint.contextLength}`
            : `自动：${defaultContextLength}`;
          contextInput.value = mapping.contextLength ? String(mapping.contextLength) : '';
          autoButton.disabled = !mapping.contextLength;
          if (mapping.contextLength) {
            contextHint.textContent = hint && hint.contextLength === mapping.contextLength
              ? `已按${hint.source}填入：${mapping.contextLength}`
              : `手动值：${mapping.contextLength}` + (hint ? `（${hint.source}建议 ${hint.contextLength}）` : '');
          } else if (hint) {
            contextHint.textContent = `自动：${hint.contextLength} · 匹配${hint.source}（${hint.model}）`;
          } else {
            contextHint.textContent = `自动：默认 ${defaultContextLength} · 该模型名不在内置列表中`;
          }
        }

        // syncContext prefills the input after the target model changed.
        function syncContext() {
          const hint = contextHintFor(mapping.target);
          if (hint) {
            mapping.contextLength = hint.contextLength;
          }
          renderHint();
        }

        contextInput.addEventListener('input', () => {
          mapping.contextLength = normalizeContext(contextInput.value);
          renderHint();
        });
        contextInput.addEventListener('blur', renderHint);
        autoButton.addEventListener('click', () => {
          mapping.contextLength = 0;
          renderHint();
          contextInput.focus();
        });
        saveTableButton.addEventListener('click', () => saveContextLengthToTable(index, saveTableButton));

        renderHint();

        // 2. Modality column (checkboxes).
        const modalityCol = document.createElement('div');
        modalityCol.className = 'col-modalities';
        const modalityLabel = document.createElement('div');
        modalityLabel.className = 'sub-label';
        modalityLabel.textContent = '支持的输入模态 (Modalities)';

        const modalityBox = document.createElement('div');
        modalityBox.className = 'checkboxes';
        mapping.modalities = normalizeModalities(mapping.modalities);
        modalityOptions.forEach((optionItem) => {
          const label = document.createElement('label');
          label.className = 'checkbox';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = optionItem.value;
          checkbox.checked = mapping.modalities.includes(optionItem.value);
          checkbox.addEventListener('change', () => {
            const current = new Set(mapping.modalities);
            if (checkbox.checked) {
              current.add(optionItem.value);
            } else {
              current.delete(optionItem.value);
            }
            mapping.modalities = modalityOptions
              .map((item) => item.value)
              .filter((value) => current.has(value));
          });
          label.append(checkbox, document.createTextNode(optionItem.label));
          modalityBox.appendChild(label);
        });
        modalityCol.append(modalityLabel, modalityBox);

        subRow.append(contextCol, modalityCol);
        return { element: subRow, syncContext };
      }

      function render() {
        rows.replaceChildren();
        if (!mappings.length) {
          rowHeader.style.display = 'none';
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '暂无模型映射，点击上方“增加模型”添加。';
          rows.appendChild(empty);
          return;
        }
        rowHeader.style.display = 'flex';

        mappings.forEach((mapping, index) => {
          const card = document.createElement('div');
          card.className = 'mapping-card';

          // Card header: index, "alias -> target" summary and a provider-colored badge.
          // Gives every mapping an at-a-glance identity and a provider accent for scanning.
          const header = document.createElement('div');
          header.className = 'card-header';
          const indexChip = document.createElement('span');
          indexChip.className = 'card-index';
          indexChip.textContent = String(index + 1);
          const summary = document.createElement('div');
          summary.className = 'card-summary';
          const aliasSpan = document.createElement('span');
          aliasSpan.className = 'alias';
          const arrowSpan = document.createElement('span');
          arrowSpan.className = 'arrow';
          arrowSpan.textContent = '→';
          const targetSpan = document.createElement('span');
          targetSpan.className = 'target';
          summary.append(aliasSpan, arrowSpan, targetSpan);
          const badge = document.createElement('span');
          badge.className = 'badge';
          const pinIcon = document.createElement('span');
          const badgeLabel = document.createElement('span');
          badgeLabel.className = 'label';
          badge.append(pinIcon, badgeLabel);
          header.append(indexChip, summary, badge);

          function updateHeader() {
            aliasSpan.textContent = mapping.name || '（未命名）';
            aliasSpan.title = mapping.name || '';
            aliasSpan.classList.toggle('placeholder', !mapping.name);
            targetSpan.textContent = mapping.target || '（未选择模型）';
            targetSpan.title = mapping.target || '';
            targetSpan.classList.toggle('placeholder', !mapping.target);
            const provider = (mapping.provider || '').trim().toLowerCase();
            const pinned = Boolean((mapping.auth || '').trim());
            const entry = findEntryForMapping(mapping);
            // Color by the resolved entry's provider so a legacy saved name (e.g. a bare
            // compat name) shares the accent of the credential it actually maps to.
            const accent = accentFor(entry ? entry.provider : provider);
            card.style.setProperty('--card-accent', accent.solid);
            card.style.setProperty('--card-accent-soft', accent.soft);
            card.style.setProperty('--card-accent-border', accent.border);
            if (!provider) {
              badge.style.display = 'none';
              return;
            }
            badge.style.display = '';
            pinIcon.textContent = pinned ? '📌' : '';
            if (pinned) {
              badgeLabel.textContent = (entry && entry.authId === mapping.auth) ? entry.label : mapping.auth;
            } else {
              badgeLabel.textContent = entry ? entry.label : provider;
            }
            badge.title = pinned ? `固定凭证：${badgeLabel.textContent}` : badgeLabel.textContent;
          }

          const row = document.createElement('div');
          row.className = 'row';

          // 1. Provider / credential column
          const providerCol = document.createElement('div');
          providerCol.className = 'col-provider';

          const providerSelect = document.createElement('select');
          providerSelect.title = '选择供应商（仅显示实际配置的凭证）';

          const curProvider = (mapping.provider || '').trim().toLowerCase();
          const curAuth = (mapping.auth || '').trim();
          const currentEntry = findEntryForMapping(mapping);

          if (!curProvider) {
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '-- 请选择供应商 --';
            providerSelect.appendChild(emptyOpt);
          }

          providerEntries.forEach((entry) => {
            const opt = document.createElement('option');
            opt.value = entry.id;
            opt.textContent = entry.label;
            if (entry.title) opt.title = entry.title;
            providerSelect.appendChild(opt);
          });

          // Keep a saved provider that no configured credential matches (e.g. custom or
          // removed) selectable so nothing is silently rewritten.
          if (curProvider && !currentEntry) {
            const curOpt = document.createElement('option');
            curOpt.value = curProvider;
            curOpt.textContent = `${curProvider}${curAuth ? '（配置的凭证）' : ''}`;
            providerSelect.appendChild(curOpt);
          }

          const customProvOpt = document.createElement('option');
          customProvOpt.value = customValue;
          customProvOpt.textContent = '+ 自定义供应商...';
          providerSelect.appendChild(customProvOpt);

          if (currentEntry) {
            providerSelect.value = currentEntry.id;
          } else if (curProvider) {
            providerSelect.value = curProvider;
          } else if (providerEntries.length > 0) {
            providerSelect.value = providerEntries[0].id;
            mapping.provider = providerEntries[0].provider;
            mapping.auth = providerEntries[0].authId;
          }

          const customProvInput = document.createElement('input');
          customProvInput.className = 'custom-input';
          customProvInput.placeholder = '输入自定义供应商名称';
          customProvInput.style.display = 'none';
          customProvInput.value = curProvider;

          providerCol.append(providerSelect, customProvInput);

          // 2. Target Model Column
          const targetCol = document.createElement('div');
          targetCol.className = 'col-target';

          const targetSelect = document.createElement('select');
          targetSelect.title = '选择实际模型';

          const customTargetInput = document.createElement('input');
          customTargetInput.className = 'custom-input';
          customTargetInput.placeholder = '输入实际模型名，例如 gpt-5.5';
          customTargetInput.style.display = 'none';
          customTargetInput.value = mapping.target || '';

          function populateTargetSelect(selectedEntryId, preserveTarget = '') {
            targetSelect.replaceChildren();
            const entry = entryById(selectedEntryId);
            const models = getModelsForEntry(entry);

            if (!selectedEntryId) {
              const opt = document.createElement('option');
              opt.value = '';
              opt.textContent = '-- 请先选择供应商 --';
              targetSelect.appendChild(opt);
              targetSelect.disabled = true;
              return;
            }
            targetSelect.disabled = false;

            if (models.length === 0) {
              const opt = document.createElement('option');
              opt.value = '';
              opt.textContent = '-- 暂无已发现模型 --';
              targetSelect.appendChild(opt);
            } else {
              models.forEach((m) => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                targetSelect.appendChild(opt);
              });
            }

            if (preserveTarget && !models.includes(preserveTarget)) {
              const opt = document.createElement('option');
              opt.value = preserveTarget;
              opt.textContent = preserveTarget;
              targetSelect.appendChild(opt);
            }

            const customOpt = document.createElement('option');
            customOpt.value = customValue;
            customOpt.textContent = '+ 自定义模型...';
            targetSelect.appendChild(customOpt);

            if (preserveTarget) {
              targetSelect.value = preserveTarget;
            } else if (models.length > 0) {
              targetSelect.value = models[0];
              mapping.target = models[0];
              if (!mapping.name) {
                mapping.name = models[0];
                aliasInput.value = models[0];
              }
            } else {
              targetSelect.value = customValue;
              customTargetInput.style.display = 'block';
            }
          }

          const selectedId = currentEntry ? currentEntry.id : (curProvider || '');
          targetCol.append(targetSelect, customTargetInput);

          // 3. Client Model Alias Column
          const aliasCol = document.createElement('div');
          aliasCol.className = 'col-alias';
          const aliasInput = document.createElement('input');
          aliasInput.placeholder = '客户端模型名，例如 Port';
          aliasInput.value = mapping.name || '';
          aliasInput.addEventListener('input', () => {
            mappings[index].name = aliasInput.value;
            updateHeader();
          });
          aliasCol.appendChild(aliasInput);

          // Populate after aliasInput exists: populateTargetSelect may auto-fill it.
          populateTargetSelect(selectedId, mapping.target || '');

          // 4. Action Column
          const actionCol = document.createElement('div');
          actionCol.className = 'col-action';
          const remove = document.createElement('button');
          remove.className = 'danger';
          remove.textContent = '删除';
          remove.title = '删除此映射';
          remove.addEventListener('click', () => {
            mappings.splice(index, 1);
            render();
          });
          actionCol.appendChild(remove);

          // Events
          providerSelect.addEventListener('change', () => {
            const val = providerSelect.value;
            if (val === customValue) {
              customProvInput.style.display = 'block';
              customProvInput.focus();
              mapping.provider = customProvInput.value.trim().toLowerCase();
              mapping.auth = '';
            } else {
              customProvInput.style.display = 'none';
              const entry = entryById(val);
              if (entry) {
                mapping.provider = entry.provider;
                // Pinned credential entries carry their auth ID; provider-level entries
                // clear the pin so the host routes natively.
                mapping.auth = entry.authId;
              } else {
                mapping.provider = val.trim().toLowerCase();
                mapping.auth = '';
              }
            }
            populateTargetSelect(providerSelect.value, '');
            updateHeader();
            // The implicit target model changed too, so refresh its suggested window.
            optionsRow.syncContext();
          });

          customProvInput.addEventListener('input', () => {
            mapping.provider = customProvInput.value.trim().toLowerCase();
            mapping.auth = '';
            populateTargetSelect(providerSelect.value, mapping.target);
            updateHeader();
          });

          targetSelect.addEventListener('change', () => {
            const val = targetSelect.value;
            if (val === customValue) {
              customTargetInput.style.display = 'block';
              customTargetInput.focus();
              mapping.target = customTargetInput.value.trim();
            } else {
              customTargetInput.style.display = 'none';
              mapping.target = val.trim();
              if (!aliasInput.value) {
                aliasInput.value = mapping.target;
                mapping.name = mapping.target;
              }
            }
            // Switching to a known model prefills its built-in context window.
            updateHeader();
            optionsRow.syncContext();
          });

          customTargetInput.addEventListener('input', () => {
            mapping.target = customTargetInput.value.trim();
            if (!aliasInput.value) {
              aliasInput.value = mapping.target;
              mapping.name = mapping.target;
            }
            updateHeader();
            optionsRow.syncContext();
          });

          updateHeader();
          const optionsRow = buildOptionsRow(mapping, index);
          row.append(providerCol, targetCol, aliasCol, actionCol);
          card.append(header, row, optionsRow.element);
          rows.appendChild(card);
        });
      }

      async function loadConfig() {
        const button = document.getElementById('load');
        button.disabled = true;
        setStatus('正在读取已配置凭证和插件配置…');
        try {
          if (!managementKey) managementKey = (keyInput.value || savedKey()).trim();
          if (managementKey) {
            try { sessionStorage.setItem('unified-model-management-key', managementKey); } catch (_) {}
          }

          await fetchModelCatalog();
          const discovered = await fetchProviderEntries();

          const config = await request(configURL);
          mappings = Array.isArray(config.mappings) ? config.mappings.map(toStateMapping) : [];
          contextLengthOverrides = readContextLengthOverrides(config && config['context-lengths']);
          enhancedMode = Boolean(config && config['enhanced-mode']);
          enhancedModeInput.checked = enhancedMode;

          render();
          setStatus(
            `已读取配置：${discovered.providers} 个已配置供应商（含 ${discovered.credentials} 个可固定凭证），内置模型表 ${catalogRules.length} 条。`,
            'ok'
          );
        } catch (error) {
          const message = String(error && error.message || error);
          if (message.startsWith('401')) {
            keyPanel.classList.add('show');
            setStatus('当前请求需要管理密钥（401 Unauthorized），请在展开的输入框中填写并点击确认。', 'error');
            return;
          }
          setStatus(`读取失败：${message}`, 'error');
        } finally {
          button.disabled = false;
        }
      }

      async function saveConfig() {
        const button = document.getElementById('save');
        const normalized = buildNormalizedMappings();
        if (!normalized) return;
        button.disabled = true;
        setStatus('正在保存…');
        try {
          enhancedMode = Boolean(enhancedModeInput && enhancedModeInput.checked);
          await patchConfig({ mappings: normalized, 'enhanced-mode': enhancedMode });
          mappings = normalized.map(toStateMapping);
          render();
          setStatus(enhancedMode ? '已保存，增强模式已开启：客户端只能看到本插件别名。' : '已保存，新的模型映射立即生效。', 'ok');
        } catch (error) {
          reportSaveError(error);
        } finally {
          button.disabled = false;
        }
      }

      // buildNormalizedMappings validates the current rows and returns the config payload.
      function buildNormalizedMappings() {
        const normalized = mappings.map(toConfigMapping);
        if (normalized.some((item) => !item.name || !item.target || !item.provider)) {
          setStatus('每一行都需要选择/填写供应商、实际模型名以及客户端模型名。', 'error');
          return null;
        }
        if (normalized.some((item) => !item.modalities.length)) {
          setStatus('每一行至少需要勾选一个支持的模态。', 'error');
          return null;
        }
        const names = new Set();
        for (const item of normalized) {
          const name = item.name.toLowerCase();
          if (names.has(name)) {
            setStatus(`客户端模型名不能重复：${item.name}`, 'error');
            return null;
          }
          names.add(name);
        }
        return normalized;
      }

      async function patchConfig(payload) {
        if (!managementKey) managementKey = (keyInput.value || savedKey()).trim();
        return request(configURL, 'PATCH', payload);
      }

      function reportSaveError(error) {
        const message = String(error && error.message || error);
        if (message.startsWith('401')) {
          keyPanel.classList.add('show');
          setStatus('保存失败：需要管理密钥（401 Unauthorized），请在展开的输入框中填写密钥后重试。', 'error');
          return;
        }
        setStatus(`保存失败：${message}`, 'error');
      }

      // saveContextLengthToTable writes the alias' current context length into the table entry
      // of its target model, then lets the alias inherit that value as "auto".
      async function saveContextLengthToTable(index, button) {
        const mapping = mappings[index];
        if (!mapping) return;
        const pattern = String(mapping.target || '').trim().toLowerCase();
        const hint = contextHintFor(mapping.target);
        const value = normalizeContext(mapping.contextLength) || (hint ? hint.contextLength : 0);
        if (!pattern) {
          setStatus('需要先填写实际模型名，才能保存到模型表。', 'error');
          return;
        }
        if (!value) {
          setStatus('请先输入上下文长度，再保存到模型表。', 'error');
          return;
        }

        // Validate the whole table of rows with this alias switched to "auto".
        const previous = mappings;
        mappings = previous.map((item, position) => (position === index ? { ...item, contextLength: 0 } : item));
        const normalized = buildNormalizedMappings();
        mappings = previous;
        if (!normalized) return;

        const overrides = { ...contextLengthOverrides, [pattern]: value };
        if (button) button.disabled = true;
        setStatus(`正在写入模型表（${pattern} → ${value}）…`);
        try {
          await patchConfig({ 'context-lengths': overrides, mappings: normalized });
          contextLengthOverrides = overrides;
          applyTableOverrideLocally(pattern, value);
          mappings[index] = { ...mappings[index], contextLength: 0 };
          render();
          setStatus(`已写入模型表：${pattern} → ${value}，所有指向该模型的别名都会自动使用这个上下文长度。`, 'ok');
        } catch (error) {
          reportSaveError(error);
        } finally {
          if (button) button.disabled = false;
        }
      }

      toggleKeyBtn.addEventListener('click', () => {
        keyPanel.classList.toggle('show');
        if (keyPanel.classList.contains('show')) {
          keyInput.focus();
        }
      });

      document.getElementById('save-key-btn').addEventListener('click', () => {
        managementKey = keyInput.value.trim();
        if (managementKey) {
          try { sessionStorage.setItem('unified-model-management-key', managementKey); } catch (_) {}
        }
        loadConfig();
      });

      document.getElementById('add').addEventListener('click', () => {
        const first = providerEntries[0];
        let defaultProv = '';
        let defaultAuth = '';
        let defaultTgt = '';
        if (first) {
          defaultProv = first.provider;
          defaultAuth = first.authId;
          const models = getModelsForEntry(first);
          if (models.length > 0) {
            defaultTgt = models[0];
          }
        }
        const defaultName = mappings.length === 0 ? 'Port' : (defaultTgt || '');
        mappings.push({
          name: defaultName,
          provider: defaultProv,
          auth: defaultAuth,
          target: defaultTgt,
          contextLength: 0,
          modalities: ['text'],
        });
        render();
      });

      document.getElementById('load').addEventListener('click', loadConfig);
      document.getElementById('save').addEventListener('click', saveConfig);
      enhancedModeInput.addEventListener('change', async () => {
        const enabled = Boolean(enhancedModeInput.checked);
        enhancedModeInput.disabled = true;
        setStatus(enabled ? '正在开启增强模式…' : '正在关闭增强模式…');
        try {
          await patchConfig({ 'enhanced-mode': enabled });
          enhancedMode = enabled;
          setStatus(enabled ? '增强模式已开启：客户端模型列表只显示本插件别名。' : '增强模式已关闭：客户端恢复看到全部可用模型。', 'ok');
        } catch (error) {
          enhancedModeInput.checked = enhancedMode;
          reportSaveError(error);
        } finally {
          enhancedModeInput.disabled = false;
        }
      });

      managementKey = savedKey();
      if (managementKey) {
        keyInput.value = managementKey;
      }
      render();
      loadConfig();
    </script>
  </body>
</html>
